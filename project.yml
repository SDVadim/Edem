# Запасной вариант: если Edem.xcodeproj по какой-то причине не откроется,
# установите XcodeGen (`brew install xcodegen`) и выполните `xcodegen` в этой папке.
name: Edem
options:
  bundleIdPrefix: ru.edem
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Edem:
    type: application
    platform: iOS
    sources: [Edem]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.edem.carsharing.demo
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Едем
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна для фотоосмотра машины: снимки с отметкой времени защищают вас от претензий за чужие повреждения."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы приложить снимки осмотра машины."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  EdemTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EdemTests]
    dependencies:
      - target: Edem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ru.edem.carsharing.demo.tests
schemes:
  Edem:
    build:
      targets:
        Edem: all
        EdemTests: [test]
    test:
      targets: [EdemTests]
